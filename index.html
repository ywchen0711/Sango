<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三國志 霸王之路</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>三國志 霸王的大陸 風格 · 霸王之路</h1>
    <div id="account" class="account"></div>
    <section id="create" class="panel" hidden></section>
    <section id="camp" class="panel" hidden></section>
    <section id="result" class="panel result" hidden></section>
    <div id="field" class="field" hidden>
      <canvas id="screen"></canvas>
      <div id="battle-bar" class="controls" hidden>
        <button id="btn-start">⏸ 暫停</button>
        <button id="btn-retreat">🏳 撤退</button>
        <label>速度
          <select id="sel-speed">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
        </label>
        <label><input type="checkbox" id="chk-bars" checked> 兵力條</label>
      </div>
      <div id="tactics" class="tactics">
        <span id="tac-info" class="tac-info"></span>
        <button id="btn-general" class="tac general"></button>
        <span id="tac-buttons"></span>
        <span id="tac-hint" class="tac-hint"></span>
      </div>
      <p class="help">槍兵 剋 騎兵 · 騎兵 剋 弓兵 · 弓兵 剋 槍兵（物理）｜ 魔法：智力 vs 精神，無視相剋<br>
        空白鍵：暫停 / 繼續　滑鼠指向單位或表格列可對照<br>
        計策：消耗軍令（隨時間累積、擊破敵隊 +1），數字鍵 1–4 施放，火計 / 落雷需點選戰場位置（右鍵或 Esc 取消）；Q：主將出陣 / 撤退（你的主將不會自行出陣）<br>
        隨機事件：寶箱（點擊可派最近的士兵去撿，可能是陷阱！）、天候變化（大風助火、大雨滅火、濃霧縮短射程）、伏兵；暫停中也可以下令</p>
      <ol id="events" class="events"></ol>
      <div id="roster"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/tactics.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/account.js"></script>
  <script src="js/campaign.js"></script>
</body>
</html>
